{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 | Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'home/css/redesign.css' %}">
</head>
<body class="tl-standalone tl-standalone--error">
    <div class="tl-standalone__card">
        <div class="tl-standalone__img">
            <img src="{% static 'home/images/404.png' %}" alt="Page not found illustration">
        </div>
        <div class="tl-standalone__icon tl-standalone__icon--error">404</div>
        <div class="tl-standalone__title tl-standalone__title--error">Page Not Found</div>
        <p class="tl-standalone__text">
            Sorry, the page you are looking for doesn't exist, has been moved,
            or is temporarily unavailable.
        </p>
        <div class="tl-standalone__actions">
            <a href="/" class="tl-btn tl-btn--primary tl-btn--lg">&larr; Back to Home</a>
        </div>
    </div>
</body>
</html>
