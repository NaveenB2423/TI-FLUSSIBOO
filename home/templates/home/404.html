{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 | Page Not Found - TI FLUSSIBOO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'home/images/icons/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'home/css/redesign.css' %}">
</head>
<body class="tl-standalone tl-standalone--error" style="display:flex; min-height:100vh; align-items:center; justify-content:center; background:#0f172a; padding:20px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <div class="tl-standalone__card" style="background:#ffffff; border-radius:24px; max-width:480px; width:100%; padding:48px 36px; text-align:center; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
        <div style="font-size:72px; font-weight:900; line-height:1; color:#5a4ff3; margin-bottom:12px;">404</div>
        <h1 style="font-size:24px; font-weight:800; color:#0f172a; margin:0 0 12px;">Page Not Found</h1>
        <p style="color:#64748b; font-size:15px; line-height:1.6; margin:0 0 28px;">
            The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.
        </p>
        <div>
            <a href="{% url 'index' %}" style="display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; color:#ffffff; background:linear-gradient(135deg, #5a4ff3, #7b71ff); padding:14px 32px; border-radius:12px; font-weight:700; font-size:15px; box-shadow:0 8px 20px rgba(90,79,243,0.4); transition:transform 0.2s;">
                &larr; Back to Home
            </a>
        </div>
    </div>
</body>
</html>
